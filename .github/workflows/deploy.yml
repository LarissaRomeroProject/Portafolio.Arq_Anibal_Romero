name: Deploy to GitHub Pages

on:
  push:
    branches: [ master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Publish
        run: dotnet publish Portafolio.Arq_Anibal_Romero.csproj -c Release -o release --nologo

      - name: Set base href for GitHub Pages
        run: sed -i 's#<base href="/" />#<base href="/Portafolio.Arq_Anibal_Romero/" />#g' release/wwwroot/index.html

      - name: Add .nojekyll (keeps _framework folder intact)
        run: touch release/wwwroot/.nojekyll

      - name: Copy index.html to 404.html (enables client-side routing)
        run: cp release/wwwroot/index.html release/wwwroot/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: release/wwwroot

      - id: deployment
        uses: actions/deploy-pages@v4
